<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandra's Pre-Foreclosure Drive-By Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117; color: #e1e4e8;
      display: flex; flex-direction: column;
    }
    /* Slim collapsible header */
    .header-bar {
      background: #161b22; border-bottom: 1px solid #30363d;
      padding: 0 14px; height: 44px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-bar h1 { font-size: 0.95rem; font-weight: 700; color: #f0f6fc; }
    .header-toggle {
      background: none; border: none; color: #8b949e;
      font-size: 18px; cursor: pointer; padding: 4px 8px; line-height: 1;
    }
    .header-details {
      background: #1c2128; border-bottom: 1px solid #30363d;
      padding: 10px 14px; flex-shrink: 0; display: none;
    }
    .header-details.open { display: block; }
    .stats-strip {
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .stat { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-red    { background: #f85149; }
    .dot-orange { background: #e3b341; }
    .dot-yellow { background: #d29922; }
    .dot-blue   { background: #58a6ff; }
    .dot-gray   { background: #6e7681; }
    .stat span  { color: #8b949e; }
    .stat strong { color: #f0f6fc; }

    #progress-bar-wrap {
      background: #161b22; padding: 14px 20px;
      border-bottom: 1px solid #30363d; display: none;
      flex-shrink: 0;
    }
    #progress-label { font-size: 0.85rem; color: #8b949e; margin-bottom: 6px; }
    #progress-track {
      background: #21262d; border-radius: 4px; height: 8px; overflow: hidden;
    }
    #progress-fill {
      background: #7B2FBE; height: 100%; width: 0%; transition: width 0.3s;
    }

    #map { width: 100%; flex: 1; min-height: 0; border-bottom: 1px solid #30363d; }

    /* Filters */
    .filters {
      background: #161b22; padding: 12px 20px;
      border-bottom: 1px solid #30363d;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    }
    .filters label { font-size: 0.82rem; color: #8b949e; }
    .filter-btn {
      background: #21262d; border: 1px solid #30363d; color: #e1e4e8;
      padding: 5px 12px; border-radius: 20px; font-size: 0.78rem; cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active { background: #7B2FBE; border-color: #7B2FBE; color: #fff; }
    .filter-btn:hover { border-color: #58a6ff; color: #58a6ff; }
    #search-input {
      background: #21262d; border: 1px solid #30363d; color: #e1e4e8;
      padding: 5px 10px; border-radius: 6px; font-size: 0.82rem;
      outline: none; width: 200px;
    }
    #search-input::placeholder { color: #6e7681; }
    #result-count { font-size: 0.78rem; color: #8b949e; margin-left: auto; }

    /* Cards */
    .cards-section { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .cards-section h2 {
      font-size: 0.88rem; font-weight: 600; color: #8b949e;
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }

    .prop-card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; overflow: hidden; cursor: pointer;
      transition: border-color 0.2s;
    }
    .prop-card:hover { border-color: #58a6ff; }
    .prop-card.signal-critical { border-color: #f85149; box-shadow: 0 0 0 1px #f85149; }
    .prop-card.signal-high     { border-color: #e3b341; }
    .prop-card.signal-medium   { border-color: #d29922; }

    .card-header {
      padding: 12px 14px; background: #1c2128;
      border-bottom: 1px solid #30363d;
      display: flex; justify-content: space-between; align-items: flex-start;
    }
    .card-address { font-weight: 700; font-size: 0.95rem; color: #f0f6fc; }
    .card-city    { font-size: 0.75rem; color: #8b949e; margin-top: 2px; }
    .badge {
      padding: 3px 8px; border-radius: 20px; font-size: 0.7rem;
      font-weight: 700; white-space: nowrap; flex-shrink: 0; margin-left: 8px;
    }
    .badge-red    { background: #3d1a19; color: #f85149; }
    .badge-orange { background: #3d2e0a; color: #e3b341; }
    .badge-yellow { background: #2d2511; color: #d29922; }
    .badge-blue   { background: #112233; color: #58a6ff; }
    .badge-gray   { background: #21262d; color: #8b949e; }

    .card-signals { padding: 8px 14px; display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid #21262d; }
    .sig-tag {
      font-size: 0.68rem; padding: 2px 6px; border-radius: 4px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .sig-shutoff { background: #3d1a19; color: #f85149; }
    .sig-vacant  { background: #1f2937; color: #60a5fa; }
    .sig-absentee{ background: #1a2030; color: #7c3aed; color: #a78bfa; }
    .sig-fc      { background: #3d2e0a; color: #e3b341; }
    .sig-poor    { background: #1c1a22; color: #d1d5db; }
    .sig-tax     { background: #2d1a0a; color: #fb923c; }
    .sig-reverse { background: #1a2d1a; color: #4ade80; }

    .card-details { padding: 10px 14px; }
    .detail-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 0; border-bottom: 1px solid #21262d; font-size: 0.82rem;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #8b949e; }
    .detail-value { color: #f0f6fc; font-weight: 500; text-align: right; max-width: 60%; }
    .detail-value.warn { color: #e3b341; }
    .detail-value.danger { color: #f85149; }

    .card-footer { padding: 10px 14px; border-top: 1px solid #30363d; }
    .goto-btn {
      display: block; text-align: center; background: #21262d; color: #58a6ff;
      text-decoration: none; padding: 7px; border-radius: 6px;
      font-size: 0.82rem; font-weight: 600; transition: background 0.2s;
      cursor: pointer; border: none; width: 100%;
    }
    .goto-btn:hover { background: #30363d; }

    /* Leaflet dark overrides */
    .leaflet-container { background: #0f1117; }
    .leaflet-popup-content-wrapper {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      color: #e1e4e8; box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    .leaflet-popup-tip { background: #161b22; }
    .leaflet-popup-content { margin: 10px 14px; }
    .popup-addr { font-weight: 700; font-size: 0.92rem; color: #f0f6fc; margin-bottom: 4px; }
    .popup-owner { font-size: 0.8rem; color: #8b949e; margin-bottom: 6px; }
    .popup-signals { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .popup-row { font-size: 0.78rem; color: #8b949e; margin: 2px 0; }
    .popup-row strong { color: #f0f6fc; }
    .popup-link {
      display: inline-block; margin-top: 8px; background: #7B2FBE; color: #fff;
      text-decoration: none; padding: 5px 10px; border-radius: 5px;
      font-size: 0.78rem; font-weight: 600;
    }
    .leaflet-popup-close-button { color: #8b949e !important; }

    /* Legend — positioned by Leaflet bottomright control */
    /* Compact count·emoji·label chip (Hot Leads style) */
    .legend {
      background: rgba(0,0,0,0.65); border: none;
      border-radius: 8px; padding: 5px 8px; font-size: 11px; line-height: 1;
    }
    .legend-row { display: grid; grid-template-columns: 28px 16px auto; align-items: center; gap: 5px; padding: 4px 0; }
    .legend-row .lg-ct { text-align: right; font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
    .legend-row .lg-em { text-align: center; font-size: 11px; line-height: 1; }
    .legend-row .lg-lb { font-weight: 800; letter-spacing: 0.02em; }


    /* Bottom drawer for leads list */
    .drawer-fab {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #7B2FBE; color: #fff; border: none; border-radius: 22px;
      padding: 10px 20px; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; z-index: 500; box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
    .drawer-fab:active { background: #5f2496; }
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 600; display: none;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 90vh; background: #161b22;
      border-radius: 14px 14px 0 0; z-index: 700;
      display: flex; flex-direction: column;
      transform: translateY(100%); transition: transform 0.3s ease;
    }
    .drawer.open { transform: translateY(0); }
    .drawer-handle {
      text-align: center; padding: 10px 0 0;
      color: #8b949e; cursor: pointer; flex-shrink: 0;
    }
    .drawer-handle::before {
      content: ''; display: inline-block;
      width: 36px; height: 4px; background: #30363d;
      border-radius: 2px;
    }
    .drawer-header {
      padding: 10px 16px 8px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
      border-bottom: 1px solid #30363d;
    }
    .drawer-header h2 {
      font-size: 0.9rem; font-weight: 700; color: #f0f6fc; margin: 0;
    }
    .drawer-close {
      background: none; border: none; color: #8b949e;
      font-size: 20px; cursor: pointer; padding: 2px 6px;
    }
    .drawer-body {
      flex: 1; overflow-y: auto; padding: 8px 12px 24px;
    }

    .card-flags { display: flex; gap: 5px; flex-wrap: wrap; padding: 4px 0 2px; }
    .flag { font-size: 0.68rem; font-weight: 800; padding: 2px 7px; border-radius: 99px; }
    .flag-occ    { background: #1f4d2e; color: #4ade80; border: 1px solid #2a7a4e; }
    .flag-vacant { background: #3b1a1a; color: #f87171; border: 1px solid #7f1d1d; }
    .flag-oos    { background: #1e2d4a; color: #93c5fd; border: 1px solid #1d4ed8; }

    /* Motivating Factors + Mortgage sub-cards */
    .sub-card {
      background: #1c2128; border: 1px solid #30363d;
      border-radius: 8px; padding: 9px 11px; margin-top: 8px;
    }
    .sub-card-title {
      font-size: 0.7rem; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.07em; color: #6b7a8c; margin-bottom: 6px;
      display: flex; align-items: center; gap: 5px;
    }
    .why-item {
      font-size: 0.8rem; color: #e1e4e8; padding: 3px 0;
      border-top: 1px solid #30363d; line-height: 1.4;
    }
    .why-item:first-of-type { border-top: none; }
    .mtg-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.8rem; padding: 3px 0; border-top: 1px solid #30363d;
    }
    .mtg-row:first-of-type { border-top: none; }
    .mtg-key { color: #6b7a8c; flex-shrink: 0; margin-right: 8px; }
    .mtg-val { color: #e1e4e8; text-align: right; }
    .mtg-val.warn { color: #e3b341; }
    .mtg-val.danger { color: #f85149; }
    .mtg-val.good  { color: #4ade80; }
    .hidden { display: none !important; }

    @keyframes gps-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(79,195,247,0.5), 0 2px 8px rgba(0,0,0,0.5); }
      70%  { box-shadow: 0 0 0 12px rgba(79,195,247,0), 0 2px 8px rgba(0,0,0,0.5); }
      100% { box-shadow: 0 0 0 0 rgba(79,195,247,0), 0 2px 8px rgba(0,0,0,0.5); }
    }

    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; }
    }
    /* ════════════════════════════════════════════════════════════════════════
       HOT-LEADS-STYLE LEAD DRAWER (bottom sheet shown on pin tap)
       Ported from Scripts/hot_leads_map.html. All sheet-internal classes are
       namespaced under #bottom-sheet so they can't collide with the existing
       "View leads" list drawer above. 2026-06-09.
       ════════════════════════════════════════════════════════════════════════ */
    #bs-overlay { display:none; position:fixed; inset:0; z-index:3000; background:rgba(0,0,0,0.45); }
    #bs-overlay.open { display:block; }
    #bottom-sheet {
      position:fixed; bottom:0; left:0; right:0; z-index:3100;
      background:#14181d; border-radius:18px 18px 0 0; border-top:1px solid #2a333d;
      max-height:88vh; display:flex; flex-direction:column;
      padding-top:max(14px, env(safe-area-inset-top));
      transform:translateY(105%); transition:transform 0.28s cubic-bezier(0.22,1,0.36,1);
      font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #bottom-sheet.open { transform:translateY(0); }
    #bs-header { display:flex; align-items:center; justify-content:center; padding:12px 50px 10px; position:relative; flex-shrink:0; border-bottom:1px solid #1a1f26; }
    #bs-drag span { display:inline-block; width:40px; height:4px; background:#3a4654; border-radius:4px; }
    #bs-close { position:absolute; top:50%; right:10px; transform:translateY(-50%); z-index:10; background:rgba(58,70,84,0.6); border:none; color:#cdd6df; font-size:17px; cursor:pointer; padding:6px 12px; border-radius:8px; line-height:1; min-width:36px; min-height:36px; -webkit-tap-highlight-color:transparent; }
    #bs-close:active { opacity:0.6; }
    #bs-scroll-body { overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; flex:1; min-height:0; }
    #bs-content { padding:12px 12px calc(env(safe-area-inset-bottom) + 20px); color:#eee; font-size:13px; }

    #bottom-sheet .popup-addr { font-weight:800; font-size:16px; color:#fff; line-height:1.2; }
    #bottom-sheet .popup-sub { font-size:11px; color:#7c8b9a; margin:2px 0 8px; }
    #bottom-sheet .popup-badges { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
    #bottom-sheet .badge { font-size:10px; font-weight:800; padding:3px 8px; border-radius:10px; text-transform:uppercase; letter-spacing:0.03em; display:inline-block; }
    #bottom-sheet .badge-hot { background:rgba(230,57,70,0.22); color:#ff6b78; }
    #bottom-sheet .badge-warm { background:rgba(244,162,97,0.22); color:#f6b27a; }
    #bottom-sheet .badge-cold { background:rgba(59,130,246,0.22); color:#7ab4ff; }
    #bottom-sheet .badge-note { background:rgba(59,130,246,0.18); color:#7ab4ff; }
    #bottom-sheet .badge-visited { background:rgba(34,197,94,0.18); color:#6ee7a8; }
    #bottom-sheet .badge-interested { background:rgba(250,204,21,0.20); color:#facc15; }

    #bottom-sheet .card { background:#0e1216; border-radius:10px; padding:9px 10px; margin:7px 0; border:1px solid #1f262e; }
    #bottom-sheet .card-title { font-size:10px; font-weight:800; color:#6b7a8c; text-transform:uppercase; letter-spacing:0.07em; margin-bottom:6px; display:flex; justify-content:space-between; }
    #bottom-sheet .card-title .right { color:#94a3b8; font-weight:700; letter-spacing:0; text-transform:none; }
    #bottom-sheet .snap-spec { font-size:11px; color:#cbd5e1; margin-bottom:7px; line-height:1.4; }
    #bottom-sheet .snap-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
    #bottom-sheet .snap-tile { background:#1a1f26; border-radius:6px; padding:6px 8px; }
    #bottom-sheet .snap-label { font-size:9px; font-weight:700; color:#6b7a8c; text-transform:uppercase; letter-spacing:0.06em; }
    #bottom-sheet .snap-val { font-size:15px; font-weight:800; color:#facc15; line-height:1.2; margin-top:2px; }
    #bottom-sheet .snap-val-muted { color:#5d6b7a; font-size:12px; }
    #bottom-sheet .kv-row { display:grid; grid-template-columns:78px 1fr; gap:8px; padding:3px 0; font-size:12px; line-height:1.35; }
    #bottom-sheet .kv-key { color:#6b7a8c; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:0.04em; padding-top:2px; }
    #bottom-sheet .kv-val { color:#e8eef4; word-break:break-word; }
    #bottom-sheet .kv-val-warn { color:#fb923c; }
    #bottom-sheet .kv-val-good { color:#6ee7a8; }
    #bottom-sheet .why-card { border:1px solid #4d3e1a; background:#2a2410; }
    #bottom-sheet .why-card .card-title { color:#ffcc66; }
    #bottom-sheet .why-item { font-size:12px; color:#ffeec0; padding:3px 0; line-height:1.45; }
    #bottom-sheet .dm-tag { display:inline-block; background:rgba(34,197,94,0.18); color:#6ee7a8; font-size:10px; font-weight:800; padding:2px 7px; border-radius:9px; text-transform:uppercase; letter-spacing:0.04em; margin-left:6px; }
    #bottom-sheet .dm-line { font-size:12px; color:#e8eef4; font-weight:700; margin-bottom:4px; }
    #bottom-sheet .dm-sub { font-size:11px; color:#94a3b8; margin-bottom:6px; }
    #bottom-sheet .phone-row { padding:8px 0; border-top:1px solid #1f262e; }
    #bottom-sheet .phone-row:first-of-type { border-top:none; padding-top:4px; }
    #bottom-sheet .phone-main { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
    #bottom-sheet .phone-link { color:#6ee7a8; text-decoration:none; font-weight:800; font-size:19px; letter-spacing:0.3px; }
    #bottom-sheet .phone-type { font-size:10px; color:#6b7a8c; }
    #bottom-sheet .history-row { font-size:11px; color:#94a3b8; padding:2px 0; }
    #bottom-sheet .history-row b { color:#cbd5e1; }
    #bottom-sheet .links-row { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    #bottom-sheet .link-chip { font-size:12px; padding:7px 11px; background:#1d2632; color:#93c5fd; border-radius:8px; text-decoration:none; font-weight:700; display:inline-flex; align-items:center; gap:4px; }
    #bottom-sheet .link-chip:active { opacity:0.65; }
    #bottom-sheet .actions { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:12px; }
    #bottom-sheet .btn { padding:12px 6px; border-radius:9px; border:none; cursor:pointer; font-size:13px; font-weight:700; text-align:center; color:#fff; -webkit-tap-highlight-color:transparent; transition:opacity 0.12s; }
    #bottom-sheet .btn:active { opacity:0.65; }
    #bottom-sheet .btn-primary { background:#1d4ed8; }
    #bottom-sheet .btn-success { background:#15803d; }
    #bottom-sheet .btn-warning { background:#b45309; }
    #bottom-sheet .btn-purple  { background:#6d28d9; }
    #bottom-sheet .btn-danger  { background:#7f1d1d; }
    #bottom-sheet .btn-gray    { background:#334155; grid-column:1/-1; }
    #bottom-sheet .note-editor { margin-top:10px; }
    #bottom-sheet .note-ta { width:100%; background:#0e1216; color:#e8eef4; border:1px solid #2a333d; border-radius:8px; padding:9px 10px; font-size:15px; font-family:inherit; line-height:1.4; resize:vertical; -webkit-appearance:none; }
    #bottom-sheet .note-ta:focus { outline:none; border-color:#1d4ed8; }
    #bottom-sheet .note-ed-btns { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:7px; }
    #bottom-sheet .nav-section { margin-top:10px; }
    #bottom-sheet .nav-section-label { font-size:10px; font-weight:800; color:#6b7a8c; text-transform:uppercase; letter-spacing:0.07em; margin-bottom:7px; }
    #bottom-sheet .nav-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-bottom:7px; }
    #bottom-sheet .btn-nav { padding:11px 4px 9px; border-radius:10px; border:1px solid transparent; cursor:pointer; font-size:12px; font-weight:700; text-align:center; color:#fff; text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:4px; -webkit-tap-highlight-color:transparent; }
    #bottom-sheet .btn-nav:active { opacity:0.65; }
    #bottom-sheet .btn-nav .nav-icon { font-size:22px; line-height:1; }
    #bottom-sheet .btn-nav .nav-lbl { font-size:10px; color:#94a3b8; font-weight:700; }
    #bottom-sheet .btn-apple  { background:#1c1c1e; border-color:#3a3a3c; }
    #bottom-sheet .btn-google { background:#1a3050; border-color:#1d4ed8; }
    #bottom-sheet .btn-waze   { background:#1a2e10; border-color:#3a7218; }
    #bottom-sheet .btn-route5 { width:100%; padding:13px; border-radius:10px; margin-top:1px; border:1px solid #1e4a1e; background:#0e2a0e; color:#6ee7a8; font-size:13px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; -webkit-tap-highlight-color:transparent; }
    #bottom-sheet .btn-route5:active { opacity:0.65; }
    #bottom-sheet .tile-todo { font-size:9px; color:#5d6b7a; font-style:italic; }

// ── Signal helpers ────────────────────────────────────────────────────────
function signalColor(p) {
  if (p.onShutoff || p.score >= 60) return 'critical';
  if (p.score >= 40) return 'high';
  if (p.score >= 20) return 'medium';
  return 'low';
}

function markerColor(p) {
  const sc = signalColor(p);
  if (sc === 'critical') return '#f85149';
  if (sc === 'high')     return '#e3b341';
  if (sc === 'medium')   return '#d29922';
  return '#58a6ff';
}

function markerLabel(p) {
  if (p.onShutoff)  return 'S';
  if (p.vacant)     return 'V';
  if (['Very High','High'].includes(p.fcFactor)) return 'FC';
  if (p.loanType && p.loanType.includes('Reverse')) return 'R';
  return '·';
}

// ── Marker urgency tiering (Hot Leads visual style) ────────────────────────
// Mirrors the deals.czarstrategist.com Hot Leads map: color-coded circle dots
// with 🔥 / ⚡ emoji overlays by lead motivation. Tiers are scored from the
// fields Sandra's data actually carries (see field mapping below), since this
// dataset has no auction_date yet — every record is a pre-foreclosure
// (preFcDate present on all 414), so fcFactor is the real urgency signal.
//
//   FIRE 🔥 (#e63946) — auction set/imminent OR Very High foreclosure risk
//   HOT     (#ff6b35) — High/Med-High FC risk, or any distress signal
//                       (⚡ when multiple overlapping signals = time-sensitive)
//   WARM    (#f4a261) — low-rated FC risk only (early but scored)
//   COLD    (#3a86ff) — minimal signals / early stage
const TIER_COLORS = { FIRE: '#e63946', HOT: '#ff6b35', WARM: '#f4a261', COLD: '#3a86ff' };

// Overlapping distress signals (excludes the lis-pendens itself, which is universal here).
//   back-taxes  → tax-type lien on title   vacancy → p.vacant / p.onShutoff (JEA cut)
//   absentee    → owner not on-site + out-of-state mailing
function distressSignals(p) {
  const s = [];
  if (p.vacant)    s.push('vacant');
  if (p.onShutoff) s.push('shutoff');
  if (!p.ownerOcc && p.mailState && p.mailState !== p.state) s.push('absentee');
  if (p.lienType && /tax/i.test(p.lienType)) s.push('taxlien');
  return s;
}
// Foreclosure-risk rank from the county fcFactor rating (0 = none/empty).
function fcRank(p) {
  const f = (p.fcFactor || '').toLowerCase();
  if (f === 'very high')   return 3;
  if (f === 'high')        return 2;
  if (f === 'medium high') return 1;
  if (['medium low', 'low', 'very low'].includes(f)) return 0.5;
  return 0;
}
// Days-out auction check — future-proof: triggers once auction_date/sale_date land
// in the dataset. Returns false today (no such field), so nothing is mis-tiered.
function auctionWithin(p, days) {
  const d = p.auction_date || p.sale_date || p.saleDate || p.auctionDate;
  if (!d) return false;
  const t = new Date(d).getTime();
  if (isNaN(t)) return false;
  const diff = (t - Date.now()) / 86400000;
  return diff >= 0 && diff <= days;
}
function markerTier(p) {
  const sigs = distressSignals(p);
  const fr = fcRank(p);
  // FIRE: imminent auction (≤30d), or auction ≤60d w/ a signal, or Very High FC risk
  if (auctionWithin(p, 30) || (auctionWithin(p, 60) && sigs.length >= 1) || fr >= 3) {
    return { tier: 'FIRE', color: TIER_COLORS.FIRE, emoji: '🔥' };
  }
  // HOT: High/Med-High FC risk, or any distress signal. ⚡ flags the urgent ones
  // (multiple overlapping signals, or a strong FC rating stacked with a signal).
  if (fr >= 1 || sigs.length >= 1) {
    const urgent = sigs.length >= 2 || (fr >= 2 && sigs.length >= 1);
    return { tier: 'HOT', color: TIER_COLORS.HOT, emoji: urgent ? '⚡' : '' };
  }
  // WARM: a low foreclosure-risk rating, but no other distress yet.
  if (fr > 0) return { tier: 'WARM', color: TIER_COLORS.WARM, emoji: '' };
  // COLD: early stage / minimal signals.
  return { tier: 'COLD', color: TIER_COLORS.COLD, emoji: '' };
}

function makeCircleIcon(p) {
  const { color, emoji } = markerTier(p);
  const size = emoji ? 30 : 20;   // emoji pins a touch larger; plain leads = clean dots
  // Field-state corner badges (visited ✓ / interested ⭐ / note 📝) from localStorage.
  const fld = (typeof fieldFor === 'function') ? fieldFor(p) : {};
  let badges = '';
  if (fld.outcome === 'interested')
    badges += `<div style="position:absolute;top:-7px;right:-7px;font-size:13px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.85));">⭐</div>`;
  if (['visited','talked','interested'].includes(fld.outcome))
    badges += `<div style="position:absolute;top:-7px;left:-7px;font-size:13px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.85));">✓</div>`;
  else if (fld.note)
    badges += `<div style="position:absolute;top:-7px;left:-7px;font-size:12px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.85));">📝</div>`;
  const html = `<div style="
    width:${size}px;height:${size}px;border-radius:50%;
    background:${color};border:2.5px solid #fff;
    display:flex;align-items:center;justify-content:center;
    font-size:${emoji ? 16 : 11}px;line-height:1;
    box-shadow:0 2px 8px rgba(0,0,0,0.6);position:relative;
  ">${emoji || ''}${badges}</div>`;
  return L.divIcon({
    html, className: '',
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -(size / 2 + 4)]
  });
}

function signalTags(p) {
  const tags = [];
  if (p.onShutoff) tags.push('<span class="sig-tag sig-shutoff">JEA Shutoff</span>');
  if (p.vacant)    tags.push('<span class="sig-tag sig-vacant">Vacant</span>');
  if (!p.ownerOcc && p.mailState && !['FL','','fl'].includes(p.mailState))
    tags.push(`<span class="sig-tag sig-absentee">OOS Mail (${p.mailState})</span>`);
  if (['Very High','High'].includes(p.fcFactor))
    tags.push(`<span class="sig-tag sig-fc">${p.fcFactor} FC</span>`);
  else if (p.fcFactor === 'Medium High')
    tags.push('<span class="sig-tag sig-fc">Med-High FC</span>');
  if (p.extCond === 'Poor') tags.push('<span class="sig-tag sig-poor">Poor Exterior</span>');
  if (p.lienType && p.lienType.includes('Tax'))
    tags.push('<span class="sig-tag sig-tax">Tax Lien</span>');
  if (p.loanType && p.loanType.includes('Reverse'))
    tags.push('<span class="sig-tag sig-reverse">Reverse Mtg</span>');
  return tags.join('');
}

function fmtMoney(v) {
  if (!v) return '—';
  v = String(v).replace(/[^0-9.-]/g,'');
  if (!v) return '—';
  const n = parseFloat(v);
  if (isNaN(n)) return '—';
  if (n >= 1000000) return '$' + (n/1000000).toFixed(2) + 'M';
  if (n >= 1000) return '$' + Math.round(n/1000) + 'K';
  return '$' + n.toFixed(0);
}

  const c = geocodeCache[p.full];
  if (!c) return '';
  const mi = userLatLng.distanceTo(L.latLng(c.lat, c.lng)) / 1609.34;
  return mi < 0.1 ? Math.round(mi * 5280) + ' ft' : mi.toFixed(1) + ' mi';
}

function cardBadge(p) {
  if (p.onShutoff) return '<span class="badge badge-red">SHUTOFF</span>';
  if (p.score >= 60) return '<span class="badge badge-red">WALK-AWAY</span>';
  if (p.score >= 40) return '<span class="badge badge-orange">HIGH SIGNAL</span>';
  if (p.score >= 20) return '<span class="badge badge-yellow">MEDIUM</span>';
  return '<span class="badge badge-gray">MONITOR</span>';
}

// ── Cards ─────────────────────────────────────────────────────────────────
function makeCard(p, idx) {
  const sc = signalColor(p);
  const cardClass = sc === 'critical' ? 'signal-critical' : sc === 'high' ? 'signal-high' : sc === 'medium' ? 'signal-medium' : '';
  const tags = signalTags(p);
  const ltv = p.ltv ? parseFloat(p.ltv.replace('%','')) : 0;
  const ltvColor = ltv > 100 ? 'danger' : ltv > 85 ? 'warn' : '';
  const scoreColor = p.score >= 80 ? '#f85149' : p.score >= 60 ? '#e3b341' : '#58a6ff';
  const dist = fmtDist(p);
  const mapsUrl = `https://maps.apple.com/?q=${encodeURIComponent(p.full)}`;
  const gmapsUrl = `https://maps.google.com/?q=${encodeURIComponent(p.full)}`;

  // Occupancy + mail flags
  const flags = [];
  if (p.ownerOcc) flags.push('<span class="flag flag-occ">Owner-Occ</span>');
  if (p.vacant)   flags.push('<span class="flag flag-vacant">Vacant</span>');
  if (p.mailState && p.mailState !== p.state) flags.push('<span class="flag flag-oos">OOS Mail</span>');

  return `<div class="prop-card ${cardClass}" data-idx="${idx}" id="card-${idx}">
    <div class="card-header">
      <div style="flex:1;min-width:0">
        <div class="card-address">${p.addr}</div>
        <div class="card-city">${p.city}, ${p.state} ${p.zip}${dist ? ` &bull; <span style="color:#4ade80">${dist}</span>` : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">
        ${cardBadge(p)}
        <span style="background:${scoreColor};color:#fff;font-size:0.7rem;font-weight:800;padding:2px 7px;border-radius:99px">Score ${p.score}</span>
      </div>
    </div>
    ${flags.length ? `<div class="card-flags">${flags.join('')}</div>` : ''}
    ${tags ? `<div class="card-signals">${tags}</div>` : ''}
    <div class="card-details">
      ${p.owner ? `<div class="detail-row"><span class="detail-label">Owner</span><span class="detail-value">${p.owner}</span></div>` : ''}
      <div class="detail-row">
        <span class="detail-label">Property</span>
        <span class="detail-value">${p.beds||'?'}bd / ${p.baths||'?'}ba &bull; ${p.sqft ? p.sqft.replace(/\B(?=(\d{3})+(?!\d))/g,',') + ' sf' : '?sf'} &bull; Built ${p.yr||'?'}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Est Value</span>
        <span class="detail-value">${fmtMoney(p.estVal)}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Equity</span>
        <span class="detail-value" style="${p.estEq && parseFloat(p.estEq) > 0 ? 'color:#4ade80' : 'color:#f85149'}">${fmtMoney(p.estEq)}</span>
      </div>
      ${p.extCond ? `<div class="detail-row"><span class="detail-label">Ext Cond</span><span class="detail-value">${p.extCond}</span></div>` : ''}
    </div>

    ${(()=>{
      const reasons = [];
      if (p.onShutoff)                                        reasons.push('⚡ JEA utility shutoff — no active power');
      if (p.vacant)                                           reasons.push('🏚 Property appears vacant');
      if (p.mailState && p.mailState !== p.state)             reasons.push(`📬 Owner mail goes to ${p.mailState} — absentee`);
      if (p.fcFactor === 'Very High')                         reasons.push('🚨 Very High foreclosure risk factor');
      else if (p.fcFactor === 'High')                         reasons.push('⚠️ High foreclosure risk factor');
      if (p.preFcDate)                                        reasons.push(`📋 Foreclosure filed ${p.preFcDate}`);
      if (p.preFcDef && parseFloat(p.preFcDef) > 0)          reasons.push(`💸 ${fmtMoney(p.preFcDef)} behind — default amount`);
      if (p.lienType)                                         reasons.push(`🔧 ${p.lienType}${p.lienAmt ? ' ($'+parseFloat(p.lienAmt).toFixed(0)+')' : ''} on title`);
      if (p.ownerOcc)                                         reasons.push('🏠 Owner-occupied — likely on-site');
      if (p.score >= 80)                                      reasons.push(`🔥 High walk-away score (${p.score}/100)`);
      return reasons.length ? `
    <div class="sub-card">
      <div class="sub-card-title">🔥 Motivating Factors</div>
      ${reasons.map(r => `<div class="why-item">${r}</div>`).join('')}
    </div>` : '';
    })()}

    ${(()=>{
      const rows = [];

      // Loan 1 — balance, rate, type, estimated monthly payment
      const l1bal  = p.loan1Bal  ? parseFloat(p.loan1Bal)  : (p.loanBal ? parseFloat(p.loanBal) : null);
      const l1rate = p.loan1Rate ? parseFloat(p.loan1Rate) : null;
      const l1type = p.loan1Type || p.loanType || null;

      if (l1bal)  rows.push(['Balance', fmtMoney(l1bal), ltvColor]);
      if (l1rate) rows.push(['Rate', l1rate.toFixed(2) + '%', l1rate <= 4 ? 'good' : l1rate >= 7 ? 'danger' : 'warn']);

      // Estimate monthly P&I: use loan1Date to compute remaining term
      if (l1bal && l1rate) {
        let remMonths = 360; // default 30yr
        if (p.loan1Date) {
          const origin = new Date(p.loan1Date);
          const now = new Date();
          const elapsedMonths = (now.getFullYear() - origin.getFullYear()) * 12 + (now.getMonth() - origin.getMonth());
          remMonths = Math.max(12, 360 - elapsedMonths);
        }
        const r = l1rate / 100 / 12;
        const pmt = l1bal * r * Math.pow(1+r, remMonths) / (Math.pow(1+r, remMonths) - 1);
        if (pmt > 0 && pmt < 99999) rows.push(['Est. Payment', '$' + Math.round(pmt).toLocaleString() + '/mo', '']);
      }

      if (l1type) rows.push(['Loan Type', l1type.replace('(Home Equity Conversion Mortgage)','HECM'), '']);

      // Loan 2 (if exists)
      const l2bal  = p.loan2Bal  ? parseFloat(p.loan2Bal)  : null;
      const l2rate = p.loan2Rate ? parseFloat(p.loan2Rate) : null;
      if (l2bal)  rows.push(['2nd Balance', fmtMoney(l2bal), 'warn']);
      if (l2rate) rows.push(['2nd Rate', l2rate.toFixed(2) + '%', '']);

      // LTV
      if (p.ltv) rows.push(['LTV', parseFloat(p.ltv).toFixed(1) + '%', ltvColor]);

      // Pre-FC details
      if (p.preFcDate) rows.push(['FC Filed', p.preFcDate, 'danger']);
      if (p.preFcBal && parseFloat(p.preFcBal) > 0)
                       rows.push(['FC Balance', fmtMoney(p.preFcBal), 'warn']);
      if (p.preFcDef && parseFloat(p.preFcDef) > 0)
                       rows.push(['Default Amt', fmtMoney(p.preFcDef), 'danger']);
      if (p.preFcLend) rows.push(['FC Lender', p.preFcLend, '']);

      return rows.length ? `
    <div class="sub-card">
      <div class="sub-card-title">🏦 Mortgage</div>
      ${rows.map(([k,v,cls]) => `<div class="mtg-row"><span class="mtg-key">${k}</span><span class="mtg-val ${cls}">${v}</span></div>`).join('')}
    </div>` : '';
    })()}
    <div class="card-footer" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
      <button class="goto-btn" onclick="flyToMarker(${idx})">📍 Map</button>
      <a class="goto-btn" href="${mapsUrl}" target="_blank" style="text-align:center;text-decoration:none">🍎 Apple</a>
      <a class="goto-btn" href="${gmapsUrl}" target="_blank" style="text-align:center;text-decoration:none">🗺 Google</a>
    </div>
  </div>`;
}

// ── GPS — live blue dot ────────────────────────────────────────────────────
let gpsMarker = null;
let gpsAccCircle = null;
let userLatLng = null;

const gpsDotHtml = `<div style="
  width:20px;height:20px;border-radius:50%;
  background:rgba(79,195,247,0.9);
  border:2.5px solid #fff;
  box-shadow:0 0 0 6px rgba(79,195,247,0.25), 0 2px 8px rgba(0,0,0,0.5);
  animation:gps-pulse 2s ease-in-out infinite;
"></div>`;

let _gpsCentered = false;

function initGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(pos => {
    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;
    const acc = pos.coords.accuracy;
    userLatLng = L.latLng(lat, lng);

    if (!gpsMarker) {
      gpsMarker = L.marker([lat, lng], {
        icon: L.divIcon({ html: gpsDotHtml, className:'', iconSize:[20,20], iconAnchor:[10,10] }),
        zIndexOffset: 9999
      }).addTo(map).bindPopup('<strong>You are here</strong>');

      gpsAccCircle = L.circle([lat, lng], {
        radius: acc, color:'#4fc3f7', fillColor:'#4fc3f7',
        fillOpacity:0.08, weight:1, opacity:0.4
      }).addTo(map);
    } else {
      gpsMarker.setLatLng([lat, lng]);
      gpsAccCircle.setLatLng([lat, lng]).setRadius(acc);
    }

    // Fly to user on first fix only
    if (!_gpsCentered) {
      _gpsCentered = true;
      map.flyTo([lat, lng], 14, {duration: 1.5});
    }
  }, null, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
}

// ── Nearest button ────────────────────────────────────────────────────────
function sortByNearest() {
  if (!userLatLng) { alert('GPS not yet acquired — wait a moment and try again.'); return; }
  const withDist = [...Array(PROPERTIES.length).keys()].map(i => {
    const coords = geocodeCache[PROPERTIES[i].full];
    if (!coords) return {i, dist: Infinity};
    const dist = userLatLng.distanceTo(L.latLng(coords.lat, coords.lng));
    return {i, dist};
  });
  withDist.sort((a,b) => a.dist - b.dist);
  const sorted = withDist.map(x => x.i);
  renderCards(sorted);
}

initGPS();

// ── Geocoding ─────────────────────────────────────────────────────────────
// Coords pre-embedded for 394/414 properties. ~20 unresolved ones geocode
// in the background after the map is already rendered.
const geocodeCache = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');

// Seed cache from embedded lat/lng (merges with any existing localStorage).
PROPERTIES.forEach(p => {
  if (p.lat && p.lng && !geocodeCache[p.full]) {
    geocodeCache[p.full] = {lat: p.lat, lng: p.lng};
  }
});

async function geocodeOne(p) {
  const key = p.full;
  if (geocodeCache[key]) return geocodeCache[key];
  const q = encodeURIComponent(p.full);
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`;
  try {
    const resp = await fetch(url, {headers: {'User-Agent': 'Sandra-DriveByMap/1.0'}});
    const data = await resp.json();
    if (data && data.length > 0) {
      const coords = {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
      geocodeCache[key] = coords;
      localStorage.setItem(CACHE_KEY, JSON.stringify(geocodeCache));
      return coords;
    }
  } catch(e) {}
  return null;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function geocodeAll() {
  // Render immediately with embedded coords — no blocking wait.
  buildMarkers();

  // Geocode the few remaining unresolved addresses quietly in the background.
  const missing = PROPERTIES.filter(p => !geocodeCache[p.full]);
  if (missing.length === 0) return;

  const wrap = document.getElementById('progress-bar-wrap');
  const label = document.getElementById('progress-label');
  const fill = document.getElementById('progress-fill');
  wrap.style.display = 'block';
  label.textContent = `Resolving ${missing.length} remaining addresses...`;

  let done = 0;
  for (const p of missing) {
    await geocodeOne(p);
    done++;
    fill.style.width = Math.round((done / missing.length) * 100) + '%';
    const idx = PROPERTIES.indexOf(p);
    const coords = geocodeCache[p.full];
    if (coords && idx >= 0 && !markers[idx]) {
      const marker = L.marker([coords.lat, coords.lng], {icon: makeCircleIcon(p)})
        .addTo(map);
      marker.on('click', () => showSheet(p));
      markers[idx] = marker;
    }
    await sleep(1100);
  }
  wrap.style.display = 'none';
  localStorage.setItem(CACHE_KEY, JSON.stringify(geocodeCache));
}

function popupHtml(p) {
  const tags = signalTags(p);
  return `<div class="popup-addr">${p.addr}</div>
    <div class="popup-owner">${p.owner || 'Unknown owner'} &bull; ${p.city}, ${p.zip}</div>
    <div class="popup-signals">${tags}</div>
    <div class="popup-row">${p.beds}bd / ${p.baths}ba &bull; ${p.sqft}sf &bull; ${p.yr}</div>
    <div class="popup-row">Est Value: <strong>${fmtMoney(p.estVal)}</strong> &bull; Equity: <strong>${fmtMoney(p.estEq)}</strong></div>
    ${p.preFcDef ? `<div class="popup-row" style="color:#f85149">FC Default: <strong>${fmtMoney(p.preFcDef)}</strong></div>` : ''}
    <a class="popup-link" href="https://maps.google.com/?q=${encodeURIComponent(p.full)}" target="_blank">Google Maps</a>`;
}

function buildMarkers() {
  PROPERTIES.forEach((p, idx) => {
    const coords = geocodeCache[p.full];
    if (!coords) return;
    const marker = L.marker([coords.lat, coords.lng], {icon: makeCircleIcon(p)})
      .addTo(map);
    marker.on('click', () => showSheet(p));
    markers[idx] = marker;
  });
}

function flyToMarker(idx) {
  const m = markers[idx];
  if (m) {
    closeDrawer();
    map.flyTo(m.getLatLng(), 17, {duration: 1});
    setTimeout(() => showSheet(PROPERTIES[idx]), 1100);
  } else {
    alert('This property has not been geocoded yet.');
  }
}

// ── Cards rendering ───────────────────────────────────────────────────────
function renderCards(idxList) {
  const grid = document.getElementById('cards-grid');
  const count = document.getElementById('result-count');
  grid.innerHTML = idxList.map(i => makeCard(PROPERTIES[i], i)).join('');
  if (count) count.textContent = `Showing ${idxList.length} of 89`;
}

// ── Filters ───────────────────────────────────────────────────────────────
let activeFilter = 'all';
let searchQuery  = '';

function applyFilters() {
  let list = [...Array(PROPERTIES.length).keys()];

  if (activeFilter === 'shutoff') list = list.filter(i => PROPERTIES[i].onShutoff);
  else if (activeFilter === 'vacant')   list = list.filter(i => PROPERTIES[i].vacant);
  else if (activeFilter === 'highfc')   list = list.filter(i => ['Very High','High'].includes(PROPERTIES[i].fcFactor));
  else if (activeFilter === 'walkaway') list = list.filter(i => PROPERTIES[i].score >= 50);

  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(i => {
      const p = PROPERTIES[i];
      return (p.addr + p.city + p.zip + p.owner).toLowerCase().includes(q);
    });
  }

  renderCards(list);

  // Sync marker visibility
  markers.forEach((m, i) => {
    if (!m) return;
    if (list.includes(i)) {
      if (!map.hasLayer(m)) map.addLayer(m);
    } else {
      if (map.hasLayer(m)) map.removeLayer(m);
    }
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    applyFilters();
  });
});


// ════════════════════════════════════════════════════════════════════════════
//  HOT-LEADS-STYLE LEAD DRAWER  (ported from Scripts/hot_leads_map.html)
//  Tapping a pin opens a rich bottom sheet that mirrors the hot-leads property
//  drawer. Sandra's map has no backend (sandra_map_server.py just serves this
//  static file), so the field-action buttons + notes persist to localStorage on
//  the device instead of POSTing to /api/update. Fields Sandra's data doesn't
//  carry yet (phones, assessed value, Zestimate, parcel, full mailing address)
//  render as "—" with a TODO marker — see TODO comments below.
// ════════════════════════════════════════════════════════════════════════════

// ── Field state (visited / talked / note) — device-local, survives reloads ───
const FIELD_KEY = 'sandra_field_state_v1';
let FIELD_STATE = (() => { try { return JSON.parse(localStorage.getItem(FIELD_KEY) || '{}'); } catch (e) { return {}; } })();
function fieldFor(p) { return FIELD_STATE[p.full] || {}; }
function saveFieldState() { try { localStorage.setItem(FIELD_KEY, JSON.stringify(FIELD_STATE)); } catch (e) {} }

function escH(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtPct(v) { if (v == null || v === '') return null; const n = Number(v); if (!isFinite(n) || n === 0) return null; return Math.round(n) + '%'; }

// Tier from walk-away score (mirrors hot-leads HOT/WARM/COLD). Sandra has no
// auction-flash / data-gap tiers, so we map onto the three core tiers.
function hlTier(p) {
  if (p.onShutoff || p.score >= 60) return { key: 'HOT',  cls: 'badge-hot',  icon: '🔴' };
  if (p.score >= 40)                return { key: 'WARM', cls: 'badge-warm', icon: '🟠' };
  return { key: 'COLD', cls: 'badge-cold', icon: '🔵' };
}

// ── The drawer body ──────────────────────────────────────────────────────────
function buildSheet(p) {
  const tier = hlTier(p);
  const fld = fieldFor(p);

  // Badges: tier + Sandra's signal pills (reuses signalTags) + field-state badges
  const tierBadge = `<span class="badge ${tier.cls}">${tier.icon} ${tier.key} ${p.score}</span>`;
  const sigPills = signalTags(p);  // styled .sig-tag pills (JEA Shutoff, Vacant, FC, lien, …)
  const visitedBadge = ['visited','talked','interested'].includes(fld.outcome) ? `<span class="badge badge-visited">✓ Visited</span>` : '';
  const interestedBadge = fld.outcome === 'interested' ? `<span class="badge badge-interested">⭐ Interested</span>` : '';
  const noteBadge = fld.note ? `<span class="badge badge-note">📝 Note</span>` : '';

  // ── Property Snapshot ───────────────────────────────────────────────────────
  const specsParts = [];
  if (p.beds) specsParts.push(`${p.beds} bd`);
  if (p.baths) specsParts.push(`${p.baths} ba`);
  if (p.sqft) specsParts.push(`${String(p.sqft).replace(/\B(?=(\d{3})+(?!\d))/g, ',')} sqft`);
  if (p.yr) specsParts.push(`built ${p.yr}`);
  const specsLine = specsParts.length ? specsParts.join(' · ') : null;

  const estVal = fmtMoney(p.estVal);
  // Sandra's LTV → equity % = 100 − LTV. estEq is the dollar figure.
  const eqPct = (p.ltv !== '' && p.ltv != null && isFinite(parseFloat(p.ltv))) ? fmtPct(100 - parseFloat(p.ltv)) : null;
  const eqAmt = (p.estEq && parseFloat(String(p.estEq).replace(/[^0-9.-]/g, '')) !== 0) ? fmtMoney(p.estEq) : null;

  const addrQ = encodeURIComponent(p.full || `${p.addr || ''}, ${p.city || ''}, FL ${p.zip || ''}`);
  const zillowUrl = `https://www.zillow.com/homes/${encodeURIComponent((p.full || `${p.addr} ${p.city} FL ${p.zip}`).trim())}_rb/`;
  const dmUrl = `https://app.dealmachine.com/search?q=${addrQ}`;
  const mapUrl = `https://www.google.com/maps/search/?api=1&query=${addrQ}`;

  const snapHTML = `
    <div class="card">
      <div class="card-title">Property Snapshot <span class="right">${escH(p.loanType ? 'Pre-Foreclosure' : 'Lead')}</span></div>
      ${specsLine ? `<div class="snap-spec" style="font-weight:600;">${escH(specsLine)}</div>`
                  : `<div class="snap-spec" style="color:#6b7a8c;font-style:italic;">bd / ba / sqft / year — pending enrichment</div>`}
      <div class="snap-grid">
        <div class="snap-tile"><div class="snap-label">Est Value</div><div class="snap-val ${estVal !== '—' ? '' : 'snap-val-muted'}">${estVal}</div></div>
        <div class="snap-tile"><div class="snap-label">Assessed</div><div class="snap-val snap-val-muted">—</div><div class="tile-todo">TODO: county PAO</div></div>
        <div class="snap-tile"><div class="snap-label">Zillow Zest</div><div class="snap-val snap-val-muted">—</div><div class="tile-todo">TODO: enrich</div></div>
        <div class="snap-tile"><div class="snap-label">Equity</div><div class="snap-val ${eqPct ? '' : 'snap-val-muted'}">${eqPct || '—'}${eqAmt ? ` <span style="font-size:10px;color:#94a3b8;">(${eqAmt})</span>` : ''}</div></div>
      </div>
      <div class="links-row">
        <a class="link-chip" href="${dmUrl}" target="_blank" rel="noopener">DealMachine ↗</a>
        <a class="link-chip" href="${zillowUrl}" target="_blank" rel="noopener">Zillow ↗</a>
        <a class="link-chip" href="${mapUrl}" target="_blank" rel="noopener">Map ↗</a>
      </div>
    </div>`;

  // ── Owner ───────────────────────────────────────────────────────────────────
  const ownerType = p.ownerOcc ? 'owner-occupant' : (p.vacant ? 'absentee · vacant' : 'absentee');
  const mailDiffers = p.mailState && p.mailState !== p.state;
  const mailLine = p.mailState
    ? `Mails to ${escH(p.mailState)}${mailDiffers ? ' · <span class="kv-val-warn">absentee, out-of-state</span>' : ''}`
    : '<span class="tile-todo">TODO: full mailing address not in dataset</span>';
  const ownerHTML = `
    <div class="card">
      <div class="card-title">Owner</div>
      <div class="kv-row"><div class="kv-key">Name</div><div class="kv-val">${escH(p.owner) || '—'} · ${escH(ownerType)}</div></div>
      <div class="kv-row"><div class="kv-key">Mailing</div><div class="kv-val">${p.ownerOcc ? '🏠 ' : '📬 '}${mailLine}</div></div>
      ${p.preFcDate ? `<div class="kv-row"><div class="kv-key">FC Filed</div><div class="kv-val kv-val-warn">🚨 ${escH(p.preFcDate)}</div></div>` : ''}
    </div>`;

  // ── Financials & Title ──────────────────────────────────────────────────────
  const finRows = [];
  if (p.estVal) finRows.push(['Est Value', fmtMoney(p.estVal)]);
  if (eqAmt)    finRows.push(['Equity', `<span class="kv-val-good">${eqAmt}</span>${eqPct ? ` · ${eqPct}` : ''}`]);
  if (p.ltv !== '' && p.ltv != null) finRows.push(['LTV', `${parseFloat(p.ltv).toFixed(1)}%`]);
  if (p.vacant) finRows.push(['Vacancy', '<span class="kv-val-warn">🪟 flagged VACANT</span>']);
  if (p.extCond) finRows.push(['Ext. cond.', escH(p.extCond)]);
  if (p.mlsStatus) finRows.push(['MLS status', escH(p.mlsStatus)]);
  finRows.push(['Last sale', '<span class="tile-todo">— TODO: not in dataset</span>']);
  const finHTML = `
    <div class="card">
      <div class="card-title">Financials &amp; Title</div>
      ${finRows.map(([k, v]) => `<div class="kv-row"><div class="kv-key">${k}</div><div class="kv-val">${v}</div></div>`).join('')}
    </div>`;

  // ── Mortgage (reuses Sandra's existing loan synthesis) ───────────────────────
  const mtgRows = [];
  const l1bal  = p.loan1Bal ? parseFloat(p.loan1Bal) : (p.loanBal ? parseFloat(p.loanBal) : null);
  const l1rate = p.loan1Rate ? parseFloat(p.loan1Rate) : null;
  const l1type = p.loan1Type || p.loanType || null;
  if (l1type) mtgRows.push(['Loan type', escH(l1type.replace('(Home Equity Conversion Mortgage)', 'HECM'))]);
  if (l1bal)  mtgRows.push(['Balance', fmtMoney(l1bal)]);
  if (l1rate) mtgRows.push(['Rate', l1rate.toFixed(2).replace(/\.00$/, '') + '%']);
  else        mtgRows.push(['Rate', '— <span class="snap-val-muted" style="font-size:11px;">(pull from county records)</span>']);
  if (l1bal && l1rate) {
    let remMonths = 360;
    if (p.loan1Date) {
      const o = new Date(p.loan1Date), now = new Date();
      remMonths = Math.max(12, 360 - ((now.getFullYear() - o.getFullYear()) * 12 + (now.getMonth() - o.getMonth())));
    }
    const r = l1rate / 100 / 12;
    const pmt = l1bal * r * Math.pow(1 + r, remMonths) / (Math.pow(1 + r, remMonths) - 1);
    if (pmt > 0 && pmt < 99999) mtgRows.push(['Payment', '$' + Math.round(pmt).toLocaleString() + '/mo P&amp;I']);
  }
  const l2bal = p.loan2Bal ? parseFloat(p.loan2Bal) : null;
  const l2rate = p.loan2Rate ? parseFloat(p.loan2Rate) : null;
  if (l2bal)  mtgRows.push(['2nd balance', `<span class="kv-val-warn">${fmtMoney(l2bal)}</span>`]);
  if (l2rate) mtgRows.push(['2nd rate', l2rate.toFixed(2) + '%']);
  if (p.preFcDef && parseFloat(p.preFcDef) > 0) mtgRows.push(['Default amt', `<span class="kv-val-warn">${fmtMoney(p.preFcDef)}</span>`]);
  if (p.preFcBal && parseFloat(p.preFcBal) > 0) mtgRows.push(['FC balance', fmtMoney(p.preFcBal)]);
  if (p.preFcLend) mtgRows.push(['FC lender', escH(p.preFcLend)]);
  const mtgHTML = mtgRows.length ? `
    <div class="card">
      <div class="card-title">🏦 Mortgage</div>
      ${mtgRows.map(([k, v]) => `<div class="kv-row"><div class="kv-key">${k}</div><div class="kv-val">${v}</div></div>`).join('')}
    </div>` : '';

  // ── Motivating Factors (synthesized — same logic as the list-drawer card) ─────
  const reasons = [];
  if (p.onShutoff)                             reasons.push('⚡ JEA utility shutoff — no active power');
  if (p.vacant)                                reasons.push('🏚 Property appears vacant');
  if (mailDiffers)                             reasons.push(`📬 Owner mail goes to ${escH(p.mailState)} — absentee`);
  if (p.fcFactor === 'Very High')              reasons.push('🚨 Very High foreclosure risk factor');
  else if (p.fcFactor === 'High')              reasons.push('⚠️ High foreclosure risk factor');
  else if (p.fcFactor === 'Medium High')       reasons.push('⚠️ Medium-High foreclosure risk factor');
  if (p.preFcDate)                             reasons.push(`📋 Foreclosure filed ${escH(p.preFcDate)}`);
  if (p.preFcDef && parseFloat(p.preFcDef) > 0) reasons.push(`💸 ${fmtMoney(p.preFcDef)} behind — default amount`);
  if (p.lienType)                              reasons.push(`🔧 ${escH(p.lienType)}${p.lienAmt ? ' ($' + parseFloat(p.lienAmt).toFixed(0) + ')' : ''} on title`);
  if (p.loanType && p.loanType.includes('Reverse')) reasons.push('🔁 Reverse mortgage — heirs / payoff pressure');
  if (p.score >= 60)                           reasons.push(`🔥 High walk-away score (${p.score}/100)`);
  const whyHTML = reasons.length ? `
    <div class="card why-card">
      <div class="card-title">🔥 Motivating Factors</div>
      ${reasons.map(r => `<div class="why-item">${r}</div>`).join('')}
    </div>` : '';

  // ── Who To Contact ──────────────────────────────────────────────────────────
  // Sandra's dataset has no phones/decision-maker yet → owner-of-record + drive-by prompt.
  const dmLine = p.owner
    ? `<div class="dm-line">${escH(p.owner)} <span class="dm-tag">Owner of record</span></div>${p.ownerOcc ? '<div class="dm-sub">🏠 Self · likely lives here</div>' : ''}`
    : '';
  const contactHTML = `
    <div class="card">
      <div class="card-title">📞 Who To Contact — Start Here</div>
      ${dmLine}
      <div class="dm-sub" style="color:#ff8a93;">📵 No phone yet — drive-by / mail, or run skip-trace <span class="tile-todo">(TODO: phone enrichment)</span></div>
    </div>`;

  // ── Field History (from device-local field state) ────────────────────────────
  const historyHTML = (fld.date || fld.note) ? `
    <div class="card">
      <div class="card-title">Field History</div>
      ${fld.date ? `<div class="history-row">🚗 Last touch <b>${escH(fld.date)}</b>${fld.outcome ? ` · ${escH(fld.outcome.replace(/_/g, ' '))}` : ''}</div>` : ''}
      ${fld.note ? `<div class="history-row" style="color:#cbd5e1;margin-top:4px;font-style:italic;">"${escH(fld.note).substring(0, 200)}"</div>` : ''}
    </div>` : '';

  // ── Actions + navigation ─────────────────────────────────────────────────────
  const k = escH(p.full).replace(/'/g, "\\'");
  const appleUrl  = (p.lat != null && p.lng != null) ? `https://maps.apple.com/?daddr=${p.lat},${p.lng}` : `https://maps.apple.com/?daddr=${addrQ}`;
  const googleUrl = (p.lat != null && p.lng != null) ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}` : `https://www.google.com/maps/dir/?api=1&destination=${addrQ}`;
  const wazeUrl   = (p.lat != null && p.lng != null) ? `https://waze.com/ul?ll=${p.lat},${p.lng}&navigate=yes` : `https://waze.com/ul?q=${addrQ}&navigate=yes`;
  const curNote = escH(fld.note || '');
  const actionsHTML = `
    <div class="actions">
      <button class="btn btn-primary" onclick="sheetAction('${k}','visited')">📍 Visited</button>
      <button class="btn btn-success" onclick="sheetAction('${k}','talked')">🗣️ Talked</button>
      <button class="btn btn-warning" onclick="sheetAction('${k}','not_home')">🚪 Not Home</button>
      <button class="btn btn-purple"  onclick="sheetAction('${k}','interested')">⭐ Interested</button>
      <button class="btn btn-danger"  onclick="sheetAction('${k}','not_interested')">🚫 Not Int.</button>
      <button class="btn btn-gray"    onclick="toggleSheetNote(true)">📝 Add / Edit Note</button>
    </div>
    <div id="sheet-note-ed" class="note-editor" style="display:none;">
      <textarea id="sheet-note-ta" class="note-ta" rows="3" placeholder="Drive-by note…">${curNote}</textarea>
      <div class="note-ed-btns">
        <button class="btn btn-success" onclick="saveSheetNote('${k}')">💾 Save Note</button>
        <button class="btn btn-gray" onclick="toggleSheetNote(false)">Cancel</button>
      </div>
    </div>
    <div class="nav-section">
      <div class="nav-section-label">Navigate to this lead</div>
      <div class="nav-grid">
        <a class="btn-nav btn-apple"  href="${appleUrl}"  onclick="navTo('${appleUrl.replace(/'/g, '%27')}');return false;"><span class="nav-icon">🍎</span><span class="nav-lbl">Apple Maps</span></a>
        <a class="btn-nav btn-google" href="${googleUrl}" onclick="navTo('${googleUrl.replace(/'/g, '%27')}');return false;"><span class="nav-icon">🗺️</span><span class="nav-lbl">Google Maps</span></a>
        <a class="btn-nav btn-waze"   href="${wazeUrl}"   onclick="navTo('${wazeUrl.replace(/'/g, '%27')}');return false;"><span class="nav-icon">🚗</span><span class="nav-lbl">Waze</span></a>
      </div>
      <button class="btn-route5" onclick="routeNearest5()">📍 Route 5 Nearest HOT / WARM</button>
    </div>`;

  const subLine = [p.city, p.state, p.zip].filter(Boolean).join(' ').replace(/^([^ ]+) /, '$1, ');
  return `
    <div class="popup-addr">${escH(p.addr)}</div>
    <div class="popup-sub">${escH(subLine) || '—'}</div>
    <div class="popup-badges">${tierBadge}${sigPills}${visitedBadge}${interestedBadge}${noteBadge}</div>
    ${snapHTML}${ownerHTML}${finHTML}${mtgHTML}${whyHTML}${contactHTML}${historyHTML}${actionsHTML}`;
}

// ── Show / hide ──────────────────────────────────────────────────────────────
// Open/close always clears any leftover inline transform/opacity from a drag, so
// reopening a new pin while one is already open replaces it cleanly (single fixed
// element — content is swapped, never double-stacked).
let _sheetProp = null;
function showSheet(p) {
  _sheetProp = p;
  const sheet = document.getElementById('bottom-sheet');
  const overlay = document.getElementById('bs-overlay');
  sheet.style.transition = ''; sheet.style.transform = ''; overlay.style.opacity = '';
  document.getElementById('bs-content').innerHTML = buildSheet(p);
  sheet.classList.add('open');
  overlay.classList.add('open');
  requestAnimationFrame(() => { document.getElementById('bs-scroll-body').scrollTop = 0; });
}
function hideSheet() {
  const sheet = document.getElementById('bottom-sheet');
  const overlay = document.getElementById('bs-overlay');
  // Restore the CSS transition (a drag may have set it to 'none') and clear inline
  // overrides so the sheet always slides back down the same way it came up.
  sheet.style.transition = ''; sheet.style.transform = ''; overlay.style.opacity = '';
  sheet.classList.remove('open');
  overlay.classList.remove('open');
  _sheetProp = null;
}

// ── Close affordances (X tap, backdrop tap, map tap, Esc, swipe-down) ─────────
// iOS Safari does NOT reliably fire `click` on a plain <div> (the backdrop), and
// inline onclick on it was the reason the drawer felt "stuck" on the phone. Bind
// real touch-aware listeners instead, and add a swipe-down-to-dismiss gesture.
function wireSheetClose() {
  const sheet = document.getElementById('bottom-sheet');
  const overlay = document.getElementById('bs-overlay');
  const scroller = document.getElementById('bs-scroll-body');
  const closeBtn = document.getElementById('bs-close');

  // Backdrop + X: fire on touchend (iOS) and click (desktop); idempotent.
  const closeNow = (e) => { if (e && e.cancelable) e.preventDefault(); hideSheet(); };
  [overlay, closeBtn].forEach(el => {
    if (!el) return;
    el.addEventListener('click', closeNow);
    el.addEventListener('touchend', closeNow, { passive: false });
    el.style.cursor = 'pointer';
  });

  // Esc (desktop) + tap on the map itself.
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && _sheetProp) hideSheet(); });
  if (typeof map !== 'undefined' && map && map.on) map.on('click', () => { if (_sheetProp) hideSheet(); });

  // Swipe-down-to-dismiss. Drag starts from the header always, or from the body
  // only when it's scrolled to the top (so content scrolling still works).
  let startY = null, dy = 0, dragging = false;
  const onStart = (e) => {
    const fromHeader = !!(e.target.closest && e.target.closest('#bs-header'));
    if (!fromHeader && scroller.scrollTop > 0) { startY = null; dragging = false; return; }
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    dy = 0; dragging = true;
    sheet.style.transition = 'none';
  };
  const onMove = (e) => {
    if (!dragging || startY === null) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    dy = y - startY;
    if (dy > 0) {
      if (e.cancelable) e.preventDefault();   // hold the page/body still while dragging
      sheet.style.transform = `translateY(${dy}px)`;
      overlay.style.opacity = String(Math.max(0, 1 - dy / 400));
    }
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    if (dy > 90) { hideSheet(); }            // past threshold → dismiss
    else { sheet.style.transform = ''; overlay.style.opacity = ''; }  // snap back
    startY = null; dy = 0;
  };
  sheet.addEventListener('touchstart', onStart, { passive: true });
  sheet.addEventListener('touchmove', onMove, { passive: false });
  sheet.addEventListener('touchend', onEnd);
  sheet.addEventListener('touchcancel', onEnd);
}
wireSheetClose();

// ── Field actions → localStorage (no backend on this map) ────────────────────
function propByFull(full) { return PROPERTIES.find(p => p.full === full); }
function refreshSheetAndPin(p) {
  if (_sheetProp && _sheetProp.full === p.full) document.getElementById('bs-content').innerHTML = buildSheet(p);
  const idx = PROPERTIES.indexOf(p);
  if (idx >= 0 && markers[idx]) markers[idx].setIcon(makeCircleIcon(p));
}
function sheetAction(full, action) {
  const p = propByFull(full); if (!p) return;
  const today = new Date().toISOString().slice(0, 10);
  const cur = FIELD_STATE[full] || {};
  FIELD_STATE[full] = { ...cur, outcome: action, date: today };
  saveFieldState();
  showToast(`✅ ${action.replace(/_/g, ' ')} saved`);
  refreshSheetAndPin(p);
}
function toggleSheetNote(show) {
  const ed = document.getElementById('sheet-note-ed'); if (!ed) return;
  ed.style.display = show ? 'block' : 'none';
  if (show) { const ta = document.getElementById('sheet-note-ta'); if (ta) ta.focus(); }
}
function saveSheetNote(full) {
  const p = propByFull(full); if (!p) return;
  const ta = document.getElementById('sheet-note-ta');
  const note = ta ? ta.value : '';
  const today = new Date().toISOString().slice(0, 10);
  const cur = FIELD_STATE[full] || {};
  FIELD_STATE[full] = { ...cur, note, date: cur.date || today };
  saveFieldState();
  showToast('✅ Note saved');
  refreshSheetAndPin(p);
}

// ── Navigation handoff + toast ───────────────────────────────────────────────
function navTo(url) { window.location.href = url; }
let _toastTimer = null;
function showToast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), isErr ? 4000 : 2400);
}

// ── Route 5 nearest HOT/WARM from current GPS → Google Maps ───────────────────
function routeNearest5() {
  const origin = userLatLng;
  const go = (lat, lng) => {
    const all = PROPERTIES.map(p => ({ p, c: geocodeCache[p.full] })).filter(x => x.c);
    if (!all.length) { showToast('❌ No leads loaded', true); return; }
    const ranked = all.map(x => ({
      p: x.p, c: x.c,
      heat: hlTier(x.p).key === 'HOT' ? 3 : hlTier(x.p).key === 'WARM' ? 2 : 1,
      dist: Math.hypot(x.c.lat - lat, x.c.lng - lng),
    })).sort((a, b) => b.heat !== a.heat ? b.heat - a.heat : a.dist - b.dist);
    const picks = ranked.slice(0, 5).sort((a, b) => a.dist - b.dist);
    if (!picks.length) { showToast('❌ No nearby leads', true); return; }
    const dest = picks[picks.length - 1].c;
    const mid = picks.slice(0, -1).map(x => `${x.c.lat},${x.c.lng}`).join('|');
    const url = `https://www.google.com/maps/dir/?api=1&origin=${lat},${lng}&destination=${dest.lat},${dest.lng}` + (mid ? `&waypoints=${encodeURIComponent(mid)}` : '');
    showToast(`🗺️ Opening ${picks.length}-stop route…`);
    setTimeout(() => navTo(url), 700);
  };
  if (origin) { go(origin.lat, origin.lng); return; }
  if (!navigator.geolocation) { showToast('❌ GPS unavailable', true); return; }
  showToast('📍 Finding nearest leads…');
  navigator.geolocation.getCurrentPosition(
    pos => go(pos.coords.latitude, pos.coords.longitude),
    err => showToast(`❌ GPS: ${err.message}`, true),
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

// ── Init ──────────────────────────────────────────────────────────────────
geocodeAll();
</script>
